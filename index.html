<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        #form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        input, select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        
        #result.success {
            background-color: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            display: block;
        }
        
        #result.error {
            background-color: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
        
        .result-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .result-score {
            font-size: 32px;
            font-weight: bold;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Student Performance Predictor</h1>
        
        <form id="form">
            <input type="number" name="hours_studied" placeholder="Hours Studied" step="0.1" required>
            <input type="number" name="previous_score" placeholder="Previous Score" step="0.1" required>
            <input type="number" name="sleep_hours" placeholder="Sleep Hours" step="0.1" required>
            <input type="number" name="paper_practiced" placeholder="Sample Question Papers Practiced" step="0.1" required>
            <select name="extracurricular_activity" required>
                <option value="">Select Extracurricular Activity</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
            <button type="submit">🎯 Predict Performance</button>
        </form>
        
        <div class="loading">
            <p>⏳ Making prediction...</p>
        </div>
        
        <div id="result"></div>
    </div>
    
    <script>
        const form = document.getElementById('form');
        const resultDiv = document.getElementById('result');
        const loading = document.querySelector('.loading');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Get form data
            const formData = new FormData(form);
            const data = {
                hours_studied: parseFloat(formData.get('hours_studied')),
                previous_score: parseFloat(formData.get('previous_score')),
                sleep_hours: parseFloat(formData.get('sleep_hours')),
                paper_practiced: parseFloat(formData.get('paper_practiced')),
                extracurricular_activity: formData.get('extracurricular_activity')
            };
            
            // Show loading
            loading.style.display = 'block';
            resultDiv.style.display = 'none';
            
                try {
                    // Send request to FastAPI backend
                    console.log('Request payload:', data);
                    const response = await fetch('http://127.0.0.1:8000/predict', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    console.log('Response status:', response.status);

                    // If server returned non-2xx, try to parse body for details
                    if (!response.ok) {
                        let errText = '';
                        try {
                            const errJson = await response.json();
                            errText = JSON.stringify(errJson);
                        } catch (e) {
                            errText = await response.text();
                        }
                        throw new Error(`HTTP ${response.status} - ${errText}`);
                    }

                    const result = await response.json();
                    console.log('Response JSON:', result);

                    // Display result
                    resultDiv.className = 'success';
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `
                        <div class="result-title">Predicted Score</div>
                        <div class="result-score">${result.predicted_score}</div>
                    `;

                } catch (error) {
                    console.error('Error:', error);
                    resultDiv.className = 'error';
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `
                        <div class="result-title">❌ Error</div>
                        <div>${error.message}</div>
                        <small>Open DevTools Console and check server logs for details.</small>
                    `;
                } finally {
                    loading.style.display = 'none';
                }
        });
    </script>
</body>
</html>
